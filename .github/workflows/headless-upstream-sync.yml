# Nightly: merge upstream into this fork, verify the headless MCP server, push only if green.
#
# The merge is verified on Linux here, pushed to the branch upstream-sync/candidate, verified on
# Windows and macOS by headless-ci.yml, and only then fast-forwarded onto master.
#
# Runs at 00:00 Europe/Berlin. GitHub cron is UTC only, so it is scheduled at 22:00 and 23:00 UTC
# and the first step lets through only the entry that is local midnight (CET or CEST). GitHub may
# start scheduled runs hours late; the gate tolerates that.
name: Headless upstream sync

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force_verify:
        description: Run the verification even when upstream has no new commits
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: headless-upstream-sync
  cancel-in-progress: false

env:
  SYNC_TZ: Europe/Berlin

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Midnight gate
        id: gate
        run: |
          # Scheduled runs often start hours late, so check the cron entry that fired, not the
          # clock: 23:00 UTC is midnight in winter (+0100), 22:00 UTC in summer (+0200).
          offset=$(TZ="$SYNC_TZ" date +%z)
          case "$offset" in
            +0100) wanted="0 23 * * *" ;;
            +0200) wanted="0 22 * * *" ;;
            *) wanted="" ;;
          esac
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$wanted" ]; then
            echo "Cron '${{ github.event.schedule }}' is not midnight in $SYNC_TZ (offset $offset), skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows (upstream sometimes
          # does); a fine-grained PAT with Contents + Workflows write in SYNC_TOKEN can.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Install pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Merge upstream and verify
        if: steps.gate.outputs.run == 'true'
        id: sync
        env:
          FORCE_VERIFY: ${{ inputs.force_verify && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          headless/scripts/sync-upstream.sh 2>&1 | tee sync.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Push candidate
        id: candidate
        if: steps.gate.outputs.run == 'true' && steps.sync.outputs.changed == 'true' && success()
        run: |
          git push -f origin HEAD:refs/heads/upstream-sync/candidate
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Opt-in (repository variable DISABLE_UPSTREAM_WORKFLOWS=true): upstream's CI/docs/release
      # workflows also run in the fork on every push to master and fail without its secrets.
      - name: Keep upstream's workflows off in this fork
        if: steps.gate.outputs.run == 'true' && always() && vars.DISABLE_UPSTREAM_WORKFLOWS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json name,path,state --jq '.[] | select(.state == "active") | select(.path != ".github/workflows/headless-upstream-sync.yml") | .path' |
          while read -r wf; do
            echo "disabling $wf"
            gh workflow disable "$(basename "$wf")" || true
          done

      - name: Report failure
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="upstream-sync/failed-$(date -u +%Y-%m-%d)"
          if [ "${{ steps.sync.outputs.code }}" = "3" ]; then
            git push -f origin "HEAD:refs/heads/$branch" || true
            where="The failed merge is on branch \`$branch\`."
          else
            where="The merge was aborted; ${{ github.ref_name }} is unchanged."
          fi
          title="Nightly upstream sync failed"
          body=$(printf '%s\n\nUpstream: %s\nRun: %s/%s/actions/runs/%s\nExit code: %s (2 = merge conflict, 3 = verification failed)\n\n<details><summary>Log tail</summary>\n\n```\n%s\n```\n</details>\n' \
            "$where" "${{ steps.sync.outputs.upstream_sha }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            "${{ steps.sync.outputs.code }}" "$(tail -n 80 sync.log 2>/dev/null)")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
          else gh issue create --title "$title" --body "$body" || echo "$body"; fi

  cross-platform:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/headless-ci.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
      os: '["windows-latest", "macos-latest"]'

  publish:
    needs: [sync, cross-platform]
    if: needs.sync.outputs.changed == 'true' && needs.cross-platform.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fast-forward master to the verified merge
        run: |
          sha="${{ needs.sync.outputs.sha }}"
          git fetch origin upstream-sync/candidate
          git push origin "$sha:refs/heads/${{ github.ref_name }}"
          git push origin --delete upstream-sync/candidate || true

  report-cross-platform:
    needs: [sync, cross-platform]
    if: always() && needs.cross-platform.result == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the failed merge and open an issue
        run: |
          sha="${{ needs.sync.outputs.sha }}"
          branch="upstream-sync/failed-$(date -u +%Y-%m-%d)"
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null ||
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$sha" -F force=true >/dev/null
          title="Nightly upstream sync failed"
          body=$(printf 'The merge passed on Linux but failed the Windows/macOS verification; master is unchanged.\nThe failed merge is on branch `%s`.\n\nRun: %s/%s/actions/runs/%s\n' \
            "$branch" "${{ github.server_url }}" "$GH_REPO" "${{ github.run_id }}")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi
